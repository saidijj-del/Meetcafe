name: meetcafe
description: "Meet in the middle. Find your perfect café."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.25.0
  cloud_firestore: ^4.15.0
  cloud_functions: ^4.7.0

  # State + routing
  provider: ^6.1.1
  go_router: ^13.0.1

  # Device capabilities
  geolocator: ^11.0.0
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

